<div class="intro-overlay" id="intro" role="dialog" aria-modal="true" aria-label="게임 시작"><div class="intro-box"><div class="brand">HISTORY ESCAPE ROOM · TEAM PLAY</div><h1>국제시장<br>덕수가 남긴 열 개의 기억</h1><p>낡은 상자에서 10개의 봉인이 발견되었습니다.<br>모둠과 함께 기록을 읽고, 사진을 관찰하고, 역사의 흔적을 추적하세요.<br><b>숫자, 한글 단어, 실제 장소의 주소, 영화 속 대사가 암호가 됩니다. 모둠과 함께 단서를 연결하세요.</b></p><input id="groupName" maxlength="24" placeholder="모둠 이름 (예: 3모둠)" autocomplete="off"><button class="goldbtn" id="begin">기억 상자 열기</button><p class="quiet">영화 속 인물의 편지와 녹음은 교육용 재구성입니다. 사진은 실제 사료가 아닌 재현 이미지입니다.<br>게임 기능은 Safari·Chrome에서 실행하세요. ChatGPT 파일 미리보기에서는 작동하지 않을 수 있습니다.</p></div></div>

<script>
const STAGES=[{"era":"1950.12","title":"고향을 떠나던 날","deck":"한 장의 사진에 남은 고향 이름","quote":"“아버지와 헤어지고 막순의 손을 놓쳤던 그 항구. 바다를 건너고도 그 이름을 잊지 못했다.”","story":"아버지를 기다리던 덕수의 낡은 상자에서 겨울 바다 사진이 나왔다. 사진 뒷면에는 ‘우리 가족의 긴 여정은 여기서 시작되었다. 언제나 그리운 나의 고향.’이라고 쓰여 있다.","digits":2,"answer":"흥남","papers":["<article class=\"evidence-paper\"><div class=\"paper-overline\">군사 기록 · 1950년 <span></span></div><div class=\"paper-text\"><div class=\"memo-lines\"><div>06월 25일 ─ 북한군 남침으로 전쟁 발발</div><div>09월 15일 ─ 인천상륙작전으로 전세 변화</div><div>10월 25일 ─ 중국군의 본격적 전투 개입</div><div>12월 15~24일 ─ 흥남항에서 국군·유엔군 및 피란민 철수</div></div></div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">작은 사진의 뒷면 <span>덕수의 필체</span></div><div class=\"paper-text\">“차가운 바다에 몰려든 사람들. 그날 헤어진 아버지와 누이. 고향의 이름만큼은 잊지 않겠다.”</div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">한 장의 오래된 설명문 <span>사진 설명</span></div><div class=\"paper-text\">“이곳에서 떠난 배가 피란민들을 남쪽으로 실어 날랐다. 고향을 잃은 사람들의 여정이 시작되었다.”</div></article>"],"hint1":"1950년 6월은 전쟁이 시작된 때다. 덕수가 가족과 헤어진 장면은 추운 겨울 항구에서 벌어졌다.","hint2":"12월 철수 작전이 이루어진 항구의 두 글자 이름을 살펴보자.","expl":"영화의 시작은 1950년 12월 흥남철수를 배경으로 한다. 6·25 전쟁에서 중국군의 참전 이후 국군과 유엔군이 후퇴했고, 수많은 피란민도 흥남항을 떠났다.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCAHWAdYDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABQECAwQGAAcI/8QAQhAAAgEDAwIFAgQFAwMDAwMFAQIDAAQRBRIhBjETIkFRYTJxBxRCgRUjUpGhM7HBFiRiQ9HhU3LxFzRU8CVjg8L/xAAWAQEBAQAAAAAAAAAAAAAAAAAAAQL/xAAZEQEBAQEBAQAAAAAAAAAAAAAAARFBITH/2gAMAwEAAhEDEQA/APXUPlFSLwODx6VCv0KcfvUvY8d/WtB3B5I/+aeM8HtTMZ709c9sZNBJkDuCc96XdgD09qYSQwXJx/tXHIOcUDyeMk008c/4ruMcc+1LleKobuYk8UgbOAewp20EE8/NcVBIxUC8E44NNYAN70vBHI5pCRzxQNwcn1NN9R7+nxS859iO1LjPJ7/NA3HPHJpwIwQ33BpCATwea4jBxjJoF5QjPY9qXAPAXgd6QAlQQeB/ikHDZqCQAEHOQfXFOUkADOR6VGCSSGAwfanjlRgZJqiXOTnPPpmnK2AcjmoR7U4HAA5xQSK  작업 내용을 말하고 있다.","hint2":"석탄을 캐는 직업을 두 글자로 쓰자.","expl":"1963년부터 한국인 광부들이 서독으로 취업했다. 국내 취업 기회가 부족했던 상황, 서독의 노동력 수요, 가족을 위한 소득과 송금 등이 배경이 되었다.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCAHWAdYDASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAABAUCAwYBAAcI/8QAPhAAAgEDAwMDAgQEBQMDBAMAAQIDAAQRBRIhMUFREyJhBjIUI0JxUoGRoQcVYrHBJDPRQ3LhNFPw8RYlgv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/8QAIREBAQEAAwEBAQADAQEAAAAAAAERAiExQRJRAxMiYXH/2gAMAwEAAhEDEQA/APiTMSSWOSTjBFE20IllAJAI7mgE9z8HJ8mm1qEUZxucDIxQGbmjVo4x1HU1AFBDJ6nXHHHJq5ghjjKkMzDLf6aqZ1UEOuTj28UFsMBmKCHb09xPauSJGsjKkpc49xXoartGSIky52dwKhc3UUgIRNi/Heoql2DRGONQATy3mrIbP1fw4PR2CjjtQcciucO2Av8Aej7K6MSGZow0cI4J8/FVA13aJBPLGpyI3IU47UGwx8/NFXM3qxbx1Jy371VNFLZR4njKvIu5MjqPNRVH/v4qiaXdJuCgDpivYY/ccmpFBnkc0QOAS+T0ru456ZWjPwbvA00ceI0+5qrEY2e0ZNBQELNxRUUQ44rsMJ6EYotYfT5POe1S1cWWdqJZPePYOtNLcJDLuwAgqqw2SRMSMEeKE1W8CR+jH956/tXO3bjpJJ2F1i7W6vtsP2r4ql1VIgQefFU2qD1Pf++amtu00pJ6Z4reYxuvRxyT/aCaMjsY4gGlbcf4RTLToV9L0zHn5Aq6W12yIsSlmY8DHNVAEBhRySnTtVWr6mWjW3j4A7eKu1KJtJnxdJh2GQtIGb1Ji7dTTDRMSBo9wPPipegzLuPQea9BGFTcenipSTbhsXgd6ohjOMfzqpx7yB0qwRknhqtSEZHINEDxw92P8qJRF27ivArqMIyV2Bj2zUJJ3AwExRUhOvIAx2zU41jADHnmgw5P3CpRttBJ6CiGMhAAaQ58CqWtpJue37dKrjuMDpuHg9quS5Xyw+KK8tq1vCXA5PFDyFwfzOc12W7LHAJCjpVO9nPuoixPSXPGM9a96QX3Z9tcKKY8g8+KgJDjAHSgtSQgEHjPeu+tGIjEVz80N7z16eK8cmiuuUB4NRMjEYGTUvRULuJyfFeP24wBVRAHv0q0HeAR2qAXOARVgUKeOtQdZSF/ftXVQHoa6Bnk10+4ZAxiiiLdQZBub+dEyKgf8rOP2oGI4PIpvp8qM3puFUN+o9qgXEO77VXH8qOS29CEHb168Uzhs42ulTer9wwFQ1R12GFEKsvBY1QrntLaUKIQd56+KqFkqxujAk4znFGW4jjUKSGY9av1CCe0XJT8uVetAqls1WFXjXIxURAWAkTr4xTGKeD8L6bDLYxQgRkfOSqk8UFFwioyBgdh61MW8WAUIPgVOVBNuQ9uhoaNHRiPFVBJUwfcM7u1elRBCDGMPUSzFdzc4q5Qrsp7GgrNynpICvuHB4r1SkijD5BFeoFEUKiTO04HOPNMrdRGSZBgE9qrWBo5NzEFhycVZvG0t/6fYUDGLawVBF6sjjIVaBnwGYMCGU9COnxXbS5eOeN1Yq0ZyGHavSzG4upJpBlnOelBQjhnVX4TPSvSRiV5Fh v class=\"paper-overline\">해외 인력 관련 기록 <span>역사 정보</span></div><div class=\"paper-text\">1960년대 서독은 산업 현장의 노동력뿐 아니라 병원의 간호 인력도 필요했다. 한국인 여성들의 서독 취업이 이어졌다.</div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">덕수의 수첩 <span>연필 기록</span></div><div class=\"paper-text\">“나는 탄광에서, 영자씨는 병원에서. 우리가 하는 일은 달라도 고향을 그리워하는 마음은 같았다.”</div></article>"],"hint1":"광산에서 일한 덕수와 병원에서 일한 영자의 역할은 다르다.","hint2":"병동에서 환자를 돌보는 일을 하는 사람의 직업명을 세 글자로 적어 보자.","expl":"영화 속 영자는 서독의 간호사로 등장한다. 한국인 광부와 간호 인력의 서독 취업은 당시 양국의 노동시장 상황과 관련이 있었다.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCAHWAdYDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAABAIDBQYAAQcI/8QAQxAAAgEDAwIEBAMGBAUDBAMBAQIDAAQRBRIhMUEGE1FhFCIycQcjQjNSgZGhsRUkYnIWJVPB0UNj4TQ1kvFUgvBz/8QAGAEBAQEBAQAAAAAAAAAAAAAAAQACAwT/xAAiEQEBAQEAAgMAAwEBAQAAAAAAARECITEDEkETIlEyQmH/2gAMAwEAAhEDEQA/AONWzEvlua6VpS/8ph/21zi2QhhxXStLGdKgA/drHa5JeM+2Kb2Y570W6YIH86adK5tByM02YiZMmiSPbJrAuea0Dax7V46UpVLZx1p5VzWwoDdOKsWmBGSMMa1dxD4N8USEyeaRdAfCNirFobTrchVb0ro+lJ/yuM+1UfTgGhHqOKvWmAjT4h7VqAWUBTDDINDnSp4cz6XL5T9dh6GpAJ+XjFEQfKlawuT+MdS1Ge8WHU7cQlBgMB9VEeDfEEVu3wV223J+Rj0qX/Ei0Fx8Meg9aptno9xcjdEmQp+oCuV8Uu0adew2u4yuqo6nDHpVc8CSBvHOqMuCCp5FVG51e8ttMFhdAtuIAc9RU74TvbLw7r+bybaLqIBXPrWp3NX1vt1KdgRQuqQ7/C95n9w0pJY51DxuHU9CDwaXqzKnhe6yeqmulrLyv4jQLqg+5qxeGk/yxx6VA+I1DamCOu41Y/DS4tG+1c98G+0nCPno1QWGKHhj+ajUjJ5xiuTRhkzTbxB8AjgUcY/lpHl5NSVvV4diEihU/wDtoNS+sRflsMdqiEz/AIdgjGK3EmdNGIkJ9KIu1JU0zpQ326E+lE3KHaaqzELKOCaCkHNScqcGgZU4NUSPuUzFwaDjTFSFwPy6EAG0YrQFQICvFESRLJbMp6imrc8dKdk+VS2etKVuUPHMVU96dQydc0xd5+LbB4zT6DKA5royf3SbetazJSgOKWACOtZJC+YeSaUXcA0vGB701KwVSTxUgX+YeYk9M0UgkPU01b3CtLt9elF5GaEZfzhyOawGcd6f49azj2pxGfNuB0xTTS3YPK0VkA9RSmKstCA+dP8Au4rfxUgXBFP7QBTbFeeKkYa6fGCOBTYmdm5FOyFQOlNlgi5ApSX01gUJNLQ77rB9aFsblEtmJ4Jp2wcS3RI6VitRJk8YoeWP5qMCd6blTNYJ6xTDCrBDGSg ":2,"answer":"남해","papers":["<article class=\"evidence-paper\"><div class=\"paper-overline\">엽서 앞면 <span>이후의 기록</span></div><div class=\"paper-text\">붉은 기와의 독일식 건물과 바다가 내려다보이는 풍경. “독일에서 고생한 시절을 잊지 않으려는 사람들의 마을.”</div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">우편 소인 <span>주소</span></div><div class=\"paper-text\">경상남도 □□군 / 2001년부터 조성된 독일마을</div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">지역 문화 기록 <span>마을 소개</span></div><div class=\"paper-text\">파독 광부와 간호 인력의 귀국 후 정착과 관련된 마을. 독일식 건축물이 바다를 향해 모여 있다.</div></article>","<article class=\"evidence-paper\"><div class=\"paper-overline\">옆에 끼워진 메모 <span>연대 확인</span></div><div class=\"paper-text\">“이곳은 1983년 방송보다 훨씬 뒤에 만들어진 마을이란다. 옛날의 기억을 간직하려고 나중에 끼워 둔 엽서야.”</div></article>"],"hint1":"이 엽서는 파독 시절의 것이 아니라 귀국 이후 생긴 마을을 보여준다.","hint2":"경상남도에서 독일마을이 자리한 군의 이름을 두 글자로 적는다.","expl":"경남 남해 독일마을은 파독 광부·간호 인력의 귀국 후 정착과 관련해 2001년부터 조성되었다. 1983년 이후의 장소이므로 ‘나중에 끼워 넣은 엽서’로 처리했다.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCAHWAdYDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABQECAwQGAAcI/8QAQxAAAgEDAwEHAgMFBwQABgMBAQIDAAQRBRIhMQYTIkFRYXEUMiNCgQcVM1KRJENiobHB0RZTcuElNESCkvAXY/HC/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/EACwRAAICAgIBBQABBAIDAQAAAAABAhEDIRIxQQQTIlFhQhQyUnEjoTNygdH/2gAMAwEAAhEDEQA/ANTGMqPiptgK+EU2JcIM+lTKMDpXqs4URGMYzXY8jUzAY6UhUHjHNSMiK54Fd3Yz0qXZjyrtvGKAI9vp1pduMU/Zg+1dtNAhmwGuC1Jt4rgCKAG7eKTGRT9vFcF496AI9pA/3p4GB7U7bxTtuR0/WgCJgSa7aMc1IF9q7b6ikBHjI+K7b7U8A56UoXA9aYDCnrXKuc0/B6Uu0/HvQA0UhTn2qTaaXbQBAEGTk4NKF44qXZnypuM0AM5Axj4NIE4zT+c9KUD+nlQA3ZSYyOak2k0gGeopDItuRwOKTu9rZqfFcRnpRYEY5OKUjOR61xHPSlxwaAITGBxjjypVUdKkxk5xSFaLAQAEYppTipQtOCjnApgQhMYqQACnhKUAUARlMn2rtuD0qQDJ9hSge2aAGBeMGu2eLgVJj2pPj+tADQo86aVz0HFSleKTGBRYUNHApGXJyak59K7Gef8AKkBGI1HWngDdiuxzyKXFFgR7ctny8qb3Y vidence-paper\"><div class=\"paper-overline\">낡은 군 복무 관련 기사 <span>신문 스크랩</span></div><div class=\"paper-text\">“1960년대 후반 해병대에 입대한 인기 가수 한 명이 베트남 전쟁에 참전하였다.”</div></article>"],"hint1":"노랫말이 어떤 노래인지 떠올려 보자. 노래의 가수와 사진 뒷면의 출신지를 함께 살펴보면 된다.","hint2":"1970년대의 노래 「님과 함께」를 부른 목포 출신 가수는 누구일까?","expl":"영화에서는 가수 남진이 베트남 전쟁터에서 덕수를 구해 준 것으로 묘사된다. 남진은 실제 베트남전 참전 경력이 있지만, 덕수 구출 사건은 영화의 허구적 설정이다.","photo":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBQYIBwcIChELCgkJChUPEAwRGBUaGRgVGBcbHichGx0lHRcYIi4iJSgpKywrGiAvMy8qMicqKyr/2wBDAQcICAoJChQLCxQqHBgcKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKir/wAARCAHWAdYDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgACBwEI/8QARxAAAgEDAwIEBAQEBAQDBwQDAQIDAAQRBRIhMUEGEyJRFDJhcQcjQoEVUpGhM2KxwRYkcuFDU9ElNGN0gvDxFyZkg5Ki0v/EABkBAAMBAQEAAAAAAAAAAAAAAAABAgMEBf/EACYRAAICAgMAAwACAwEBAAAAAAABAhESIQMxQRMiUTJhBENxgUL/2gAMAwEAAhEDEQA/AOjFQASnU1HtyADUoUA7cgk9qxkIwT17V0mJqoIIBzip0wXGOo71ENxPI/at0ILYPH1oYzfcwJz+1eiXPzcGvCfUO4FayrnPbFIDfzT26CpGdgASMA1AmNvPFbElunIFAG2Bg7TXq5QAjqajJwcgVsWwNvegCYyFeeazzdx6f0qPd+X6hk16D+WMCkM2fAcEHgjmtHX0nHXtWjyAKSeMdaSN4kRXlQRlhHxkd6Tko9gk30N0HHJrdmCYC80r0jVY9Vt2kTgq2Cp60du6gcirVPaF0YzkycdK0I9Rya2KMQDit40V2w3NOxEIOBx0rCMqMde1TyRFT8uB715EBhgKLCiHy+zd+1blO39cVkg2Als16j71GV496LA1UFTg8ivCSTn+1TNtGVxWgAwccmgCMgkYFet6MDvW2CRz1rwgFftTEabsNgV5jBHPNeZGea1MgU9OtO0FMnJwcV6cjrQzTnIOK8Lu/WkOggsoGSRmvfPyPSuTQyoSw3YAo6G2jxnOaltjSQG07Z6VixSSdTijvJjycgZrXKquMck0sh0DLYDq5NSJaIjc9DUhm5wRwK1eRWXinsNHrMqEhegrTzgWwelRNyM5wa0HWqSJsJ8zOdowK9XJPFQAnPFbhtvINFASmME5bjFaEAnC9q0MrZ5HFeMRnIpUBsxABFeISQcVpmt0O2nQHjZIGTWbOlen2rU8DFMRjAZGT0rUYDZHOa8bsP6V5jbTEbEjmtBwTms6tWEZ7UwMLe9R1IVrRhzx1oA1zwc14M/tXpBzyOa9AoAwjC5HU16MA881sVwOK9A4yKAPEIyalDe/7VHgYzitl+tIAe7zgY45rKkuVBVce9ZQpA0O4LVpeduBWk8DwthxkdjTdE8teBUcqCUeocVzZ7N8dCbhTn+1Yq7iSBR11bqUyg5FAAkHb0rROyGqPdxVgMVu4Oc5/wDSonY5x2FYZcx7T2pk2ebgDwcis83rjgGvEXe4UdTRUmkyCPeh59qG0hpNg3mHaFzwKmgtpLjlR+9Rx6fcFhlcCn1tGIIVXHSs5SroqMb7FMttLEBnpXiqVHXj2NOnMbkBsUJexRlcx4BpKXg3EUyoHVsnH function sidebar(){const pct=(maxStage/STAGES.length)*100;$('#sidebar').innerHTML=`<div class="brand">ODE TO MY FATHER · 2014</div><div class="side-title">덕수가 남긴<br>10개의 기억</div><div class="quiet">흥남에서 1983년까지, 영화 속 역사를 복원하라</div><div class="progress-wrap"><div class="progress-meta"><span>${clean(group||'이름 없는 모둠')}</span><b>${maxStage} / ${STAGES.length} 해제</b></div><div class="progress-track"><div class="progress-value" style="width:${pct}%"></div></div></div><div class="mission-list">${STAGES.map((s,i)=>`<button class="mission-nav ${i===current?'active':''} ${i<maxStage?'done':''} ${i<=maxStage?'available':''}" ${i>maxStage?'disabled':''} data-nav="${i}" title="${clean(s.title)}"><b>${i<maxStage?'✓':String(i+1).padStart(2,'0')}</b><span>${clean(s.title)}</span></button>`).join('')}</div><div class="side-actions"><button class="sidebtn" id="snd">${soundEnabled?'🔊 효과음 끄기':'🔇 효과음 켜기'}</button><button class="sidebtn" id="guide">교사용 정답 보기</button><button class="sidebtn" id="restart">처음부터 다시</button></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.nav;opened=false;unlockInfo=current<maxStage;hintCount=0;attempts=0;save();render()}));$('#snd').onclick=()=>{soundEnabled=!soundEnabled;sidebar()};$('#guide').onclick=teacherPanel;$('#restart').onclick=()=>{if(confirm('모둠의 진행 기록과 성찰 글을 모두 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}}}
function render(){
 sidebar();
 const s=STAGES[current],completed=current<maxStage,unlocked=completed||unlockInfo;
 const isFixed=s.kind==='text'||s.kind==='number';
 const kindLabel=s.kind==='number'?`숫자 ${s.digits}자리`:s.kind==='text'?`한글 ${s.digits}글자`:s.kind==='address'?'당시 장소를 조사해 보세요':'끊긴 말을 복원해 보세요';
 const slots=isFixed?`<div class="digits">${Array.from({length:s.digits},()=>'<div class="digit">?</div>').join('')}</div>`:'<div class="free-symbol" aria-hidden="true">✉</div>';
 const answerField=isFixed?`<input class="answer-input" inputmode="${s.kind==='number'?'numeric':'text'}" id="password" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${s.kind==='number'?`maxlength="${s.digits}"`:''} placeholder="${'•'.repeat(s.digits)}" ${unlocked?'disabled':''}>`:
 `<textarea id="password" class="answer-input free-answer ${s.kind}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${s.kind==='address'?'찾아낸 장소를 입력하세요.':'띄어쓰기·문장부호 없이 대사를 입력하세요.'}" ${unlocked?'disabled':''}></textarea>`;
 $('#content').innerHTML=`<div class="topbar"><div class="top-tag">ARCHIVE ${String(current+1).padStart(2,'0')} / ${STAGES.length} <span aria-hidden="true">✦</span> ${clean(s.era)}</div><div class="group"><span>모둠 공동 해결</span> · <strong>${clean(group||'탐사대')}</strong></div></div><h1 class="header-title">${clean(s.title)}</h1><p class="subhead">${clean(s.deck)}</p><section class="hero"><div class="scene"><div class="scene-caption">BOX NO. ${String(current+1).padStart(2,'0')}</div><button type="button" id="crate" class="crate ${opened||completed?'open':''}" aria-label="오래된 기억 상자 열기" ${opened||completed?'disabled':''}><span class="crate-lid"></span><span class="crate-body"></span><span class="crate-note">${opened||completed?'OPENED':'TAP TO OPEN'}</span></button><div class="box-hint" id="boxHint">${opened||completed?'봉인된 기록들이 모습을 드러냈다.':'낡은 상자를 눌러 기록을 꺼내 보세요.'}</div><div id="photoSlot">${opened||completed?photoHTML(s):''}</div></div><div class="story-panel"><div class="story-kicker">덕수의 수첩 · ${clean(s.era)}</div><div class="story-quote">${clean(s.quote)}</div><div class="story-note">${clean(s.story)}</div><div class="story-tip">영화 장면에 근거한 학습용 재구성 기록입니다. 모둠원과 단서를 나누어 읽으세요.</div></div></section><section class="desk-section ${opened||completed?'reveal':'hidden'}" id="desk"><div class="dossiers"><h2>✉ 상자에서 발견한 자료</h2><p>날짜·장소·인물과 자료 사이의 관계를 찾아보세요. 편지·기록 일부는 교육용 창작 자료입니다.</p><div class="paper-grid">${s.papers.join('')}</div></div><div class="lockpanel" id="lockpanel"><div class="biglock" id="lockicon">${unlocked?'🔓':'🔐'}</div><h2>${unlocked?'봉인 해제 완료':'봉인된 자물쇠'}</h2><div class="lock-sub">${kindLabel}</div>${slots}<label class="screen-reader" for="password">${kindLabel} 암호</label>${answerField}<button class="goldbtn" id="unlock" ${unlocked?'disabled':''}>${unlocked?'잠금 해제됨':'🔑 자물쇠 열기'}</button><div class="status" id="status" aria-live="polite">${unlocked?'기록을 확인했습니다.':'아직 봉인되어 있습니다.'}</div><div class="hint"><button type="button" id="hintbtn">💡 기록에서 막혔나요? 단계별 힌트</button><div id="hintbox" class="hint-content hidden"></div></div></div></section><div id="result">${unlocked?resultHTML(s):''}</div><div class="footer"><b>수업 자료 안내:</b> 실제 역사를 바탕으로 구성한 체험형 이야기입니다. 인물의 메모·편지·녹음테이프 일부는 교육용 창작 자료이며, 사진은 역사 상황을 재현한 이미지입니다. 영화 속 설정과 실제 역사적 사건은 구별하세요.</div>`;
 const crate=$('#crate');if(crate)crate.addEventListener('click',openCrate);
 const pw=$('#password'),unlock=$('#unlock');
 if(pw){
  const updateSlots=()=>{if(!isFixed)return;const ds=document.querySelectorAll('.digit');const chars=Array.from(pw.value);for(let i=0;i<ds.length;i++)ds[i].textContent=chars[i]||'?'};
  // Korean IME composes syllables across several keystrokes. Never rewrite the
  // input value while the keyboard is composing: iOS Safari can lose the syllable.
  const sanitizeNumbers=()=>{if(s.kind!=='number')return;const cleaned=pw.value.replace(/[^0-9]/g,'').slice(0,s.digits);if(pw.value!==cleaned)pw.value=cleaned};
  pw.addEventListener('input',()=>{if(s.kind==='number')sanitizeNumbers();updateSlots()});
  pw.addEventListener('compositionend',()=>{updateSlots()});
  pw.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){if(isFixed||e.ctrlKey||e.metaKey){e.preventDefault();tryUnlock()}}});
 }
 if(unlock)unlock.addEventListener('click',tryUnlock);
 $('#hintbtn').onclick=()=>{hintCount=Math.min(hintCount+1,2);const x=$('#hintbox');x.classList.remove('hidden');x.textContent=hintCount===1?s.hint1:s.hint2;};
 const nxt=$('#next');if(nxt)nxt.onclick=()=>{if(current<STAGES.length-1){current++;opened=false;unlockInfo=current<maxStage;hintCount=0;attempts=0;save();render();window.scrollTo({top:0,behavior:'smooth'})}else{showFinish()}};
 const photo=$('#photoSlot img');if(photo)photo.onclick=()=>photoZoom(s);
 bindTape();
 if(maxStage===STAGES.length&&current===STAGES.length-1&&unlocked)showFinish(true);
}
function photoHTML(s){return `<div class="photopack" title="사진 크게 보기"><div class="polaroid"><img alt="${clean(s.title)} 역사 상황을 재현한 이미지" src="${s.photo}"><span>DEOKSU'S MEMORY · ${clean(s.era)}</span></div></div><div class="photo-small">사진을 누르면 크게 볼 수 있어요 · 역사 상황 재현 이미지</div>`}
function openCrate(){if(opened)return;opened=true;const box=$('#crate');box.classList.add('open');box.disabled=true;$('#boxHint').textContent='오래된 사진과 기록들이 나타납니다…';jing(true);setTimeout(()=>{const slot=$('#photoSlot');if(slot){slot.innerHTML=photoHTML(STAGES[current]);const p=slot.querySelector('img');if(p)p.onclick=()=>photoZoom(STAGES[current])}const desk=$('#desk');if(desk){desk.classList.remove('hidden');desk.classList.add('reveal')}$('#boxHint').textContent='사진 뒷면과 함께 묶인 문서를 살펴보세요.'},700)}
function normalizedAnswer(str){return String(str||'').normalize('NFKC').toLowerCase().replace(/[^가-힣a-z0-9]/g,'')}
function correctAnswer(s,raw){
 const value=normalizedAnswer(raw),answer=normalizedAnswer(s.answer);
 if(s.kind==='address'){
  const bare=value.replace(/번지$/,'').replace(/^kbs본관/,'');
  return ['서울특별시영등포구여의도동18','서울시영등포구여의도동18','서울영등포구여의도동18','영등포구여의도동18','여의도동18'].includes(bare);
 }
 return value===answer;
}
function tryUnlock(){
 const s=STAGES[current],pw=$('#password');if(!pw)return;
 const raw=pw.value.trim(),isFixed=s.kind==='text'||s.kind==='number';
 const value=s.kind==='number'?raw.replace(/[^0-9]/g,''):normalizedAnswer(raw);
 if(isFixed&&value.length!==s.digits){
  const stat=$('#status');stat.textContent=s.kind==='number'?`숫자 ${s.digits}자리를 채워 보세요.`:`한글 ${s.digits}글자를 채워 보세요.`;stat.className='status error';return;
 }
 if(!isFixed&&!raw){const stat=$('#status');stat.textContent='찾아낸 내용을 먼저 입력해 보세요.';stat.className='status error';return;}
 if(correctAnswer(s,raw)){
  unlockInfo=true;maxStage=Math.max(maxStage,current+1);save();jing(true);
  const f=document.createElement('div');f.className='unlock-flash';document.body.appendChild(f);setTimeout(()=>f.remove(),750);
  render();setTimeout(()=>$('#result')?.scrollIntoView({behavior:'smooth',block:'center'}),150);
  if(current===STAGES.length-1){party()}
 }else{
  attempts++;jing(false);const stat=$('#status');stat.className='status error';
  stat.textContent=attempts<3?'덜컹… 자물쇠가 열리지 않습니다. 기록을 다시 대조해 보세요.':'아직 잠겨 있습니다. 단서를 서로 설명한 뒤 힌트를 확인해 보세요.';
  const panel=$('#lockpanel');panel.classList.remove('shake');void panel.offsetWidth;panel.classList.add('shake');
 }
}
function bindTape(){
 const b=$('#playTape');if(!b)return;
 b.addEventListener('click',()=>{
  const transcript=$('#tapeTranscript');if(transcript){transcript.classList.remove('hidden');transcript.classList.remove('tape-transcript');void transcript.offsetWidth;transcript.classList.add('tape-transcript')}
  const c=b.closest('.cassette');if(c)c.classList.add('playing');
  b.textContent='↻ 녹음테이프 다시 재생';
  if(soundEnabled)playTapeStatic();
  setTimeout(()=>{if(c)c.classList.remove('playing')},1700);
 });
}
function playTapeStatic(){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=new C(),n=Math.floor(ctx.sampleRate*.68),buf=ctx.createBuffer(1,n,ctx.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<n;i++){const burst=(i/n<.24||i/n>.55)?1:.22;data[i]=(Math.random()*2-1)*burst}
  const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=buf;gain.gain.value=.085;source.connect(gain);gain.connect(ctx.destination);source.start();source.onended=()=>ctx.close().catch(()=>{});
 }catch(e){}
}
function resultHTML(s){return `<section class="milestone"><h3>✓ ${current===STAGES.length-1?'마지막 기억 복원 완료':'기억 복원 성공'}</h3><p>${clean(s.expl)}</p><button class="goldbtn" id="next">${current===STAGES.length-1?'마지막 메시지 확인하기':'다음 기억의 상자 열기 →'}</button></section>`}
function photoZoom(s){const ov=document.createElement('div');ov.className='teacher-modal';ov.style.cursor='zoom-out';ov.innerHTML=`<div style="max-width:min(620px,92vw);padding:12px;background:#f5ecdb;border-radius:8px;box-shadow:0 20px 70px #000;"><img src="${s.photo}" alt="${clean(s.title)} 재현 이미지" style="width:100%;display:block;border-radius:4px"><div style="color:#333;font-size:12px;margin-top:8px;text-align:center">역사 상황 재현 이미지 · 화면 아무 곳이나 눌러 닫기</div></div>`;ov.onclick=()=>ov.remove();document.body.appendChild(ov)}
function party(){for(let i=0;i<45;i++){const x=document.createElement('span');x.className='confetti';x.style.left=(Math.random()*100)+'vw';x.style.background=['#e4b670','#e7ddc6','#92c3c2','#d58e84'][i%4];x.style.animationDuration=(1.8+Math.random()*2)+'s';x.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),4600)}}
function showFinish(quiet=false){if(!quiet)party();const r=$('#result');if(!r)return;r.innerHTML=`<div class="congrats"><div class="brand">THE FINAL LETTER</div><h2>모든 기억이 열렸습니다</h2><p>덕수는 막순을 다시 만났지만, 흥남에서 헤어진 아버지의 빈자리는 오래 남았습니다.<br>젊은 시절의 선택들이 지금의 덕수를 만들었습니다.</p><p><b>모둠의 마지막 기록</b><br>오늘날의 시선에서 답답해 보일 수 있는 덕수의 행동 하나를 떠올려 보세요. 그 행동을 이해하는 데 도움이 된 역사적 경험을 두 가지 이상 연결해 설명해 보세요. <br><small>이해한다는 것은 반드시 동의한다는 뜻은 아닙니다.</small></p><textarea id="reflect" placeholder="예: 덕수의 ○○한 행동은 답답했지만, 그가 …(역사적 경험 2가지)… 를 겪었기에 …"></textarea><div class="button-row"><button class="goldbtn" style="max-width:270px" id="export">모둠 기록 내려받기 (.txt)</button><button class="ghostbtn" id="saveText">이 기기에 임시 저장</button></div><p style="font-size:11px;color:#b3c1c8">모둠 이름과 성찰 글은 이 기기 안에 저장되며 다른 곳으로 자동 전송되지 않습니다.</p></div>`;const input=$('#reflect');input.value=reflection;input.addEventListener('input',()=>{reflection=input.value;save()});$('#saveText').onclick=()=>{reflection=input.value;save();alert('이 기기에 임시 저장했습니다.')};$('#export').onclick=()=>{reflection=input.value;save();let t=`국제시장 역사 방탈출 · 모둠 성찰\n모둠: ${group}\n복원: ${maxStage}/${STAGES.length}\n\n${reflection}\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='국제시장_모둠성찰_'+(group.replace(/[^가-힣a-zA-Z0-9_-]/g,'_')||'모둠')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};}
function teacherPanel(){const host=$('#teacher');host.classList.remove('hidden');host.innerHTML=`<div class="teacher-inner"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><h2>교사용 해설 · 수업 운영</h2><button class="ghostbtn" id="closeTeach">닫기 ✕</button></div><p style="font-size:13px">교사용 암호를 입력하면 ${STAGES.length}개 미션의 정답과 역사적 해설이 표시됩니다.</p><div id="teacherGate"><input id="teacherPw" inputmode="numeric" maxlength="4" type="password" placeholder="교사용 암호"><button class="ghostbtn" id="teacherOpen">확인</button><small style="display:block;color:#777">교사용 암호는 별도 안내문을 확인하세요. (이 기능은 강력한 보안 장치가 아닙니다)</small></div><div id="teacherContents" class="hidden"></div></div>`;$('#closeTeach').onclick=()=>host.classList.add('hidden');$('#teacherOpen').onclick=()=>{if($('#teacherPw').value!=='2026'){alert('암호를 확인하세요.');return}$('#teacherGate').classList.add('hidden');let body=`<p>진행: 4인 모둠, 10단계 순서대로 해제. 흥남과 피란 → 서독 취업 → 베트남 → 1983년 이산가족 찾기. 45분 수업은 시간상 빠듯하므로 2차시 또는 힌트 허용 추천.</p><table><tr><th>단계</th><th>정답</th><th>교사용 해설</th></tr>${STAGES.map((s,i)=>`<tr><td>${i+1}. ${clean(s.title)}</td><td><b>${s.answer}</b></td><td>${clean(s.expl)}</td></tr>`).join('')}</table><h3>사실 확인용 참고 자료</h3><ul>${SOURCES.map(a=>`<li><a href="${a[1]}" target="_blank" rel="noopener noreferrer">${clean(a[0])}</a></li>`).join('')}</ul><p><b>유의:</b> 사진 10장은 실제 역사 사진이 아닌 재현 이미지이며, 덕수의 수첩·대사·서류·봉인번호·최종 접수증은 수업용 창작물입니다. 독일마을은 2001년 이후 조성됐으므로 1960년대 기록 뒤에 ‘훗날 끼워 넣은 엽서’로 등장시켰습니다. 영화 속 남진의 덕수 구출은 영화적 설정이며, 실제 남진의 베트남전 참전과 구별합니다. 9번은 검색 활동으로 지번 주소를 조사하므로 인터넷 연결이 필요할 수 있습니다. 10번의 손상된 테이프는 재구성한 학습용 장치입니다.</p>`;$('#teacherContents').innerHTML=body;$('#teacherContents').classList.remove('hidden')};$('#teacherPw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#teacherOpen').click()});host.addEventListener('click',e=>{if(e.target===host)host.classList.add('hidden')},{once:true});}
function launch(){const name=$('#groupName').value.trim();group=name||group||'역사 탐사대';save();$('#intro').classList.add('hidden');render()}
$('#groupName').value=group;$('#begin').onclick=launch;$('#groupName').onkeydown=e=>{if(e.key==='Enter')launch()};
if(group){$('#intro').classList.add('hidden');render()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#teacher').classList.add('hidden')});
</script></body></html>
